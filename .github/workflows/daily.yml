name: Daily Curation

on:
  schedule:
    - cron: "10 11 * * *" # UTC 11:10 = 20:10 KST (staggered to avoid overlap with CuraDevOps)
  workflow_dispatch:
  push: # site-content pushes trigger deploy only (collection/judgment skipped)
    branches: [main]
    paths:
      - "content/**"
      - "layouts/**"
      - "archetypes/**"
      - "hugo.toml"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: curasec-pipeline
  cancel-in-progress: false

jobs:
  # collection pause gate: checks for the .collect-paused marker file
  # (pause/resume: Actions tab "Pipeline Control", or pipeline/pause.sh / resume.sh)
  gate:
    # push events are deploy-only — skip collection/judgment
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.check.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .collect-paused
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          if [ -f .collect-paused ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Collection is paused (.collect-paused exists) — resume via Actions tab Pipeline Control"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.paused == 'false'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Collect & judge
        id: judge
        # even if a fatal error (credit exhaustion etc.) aborts the run,
        # judgments completed before the abort must still get committed
        continue-on-error: true
        env:
          # with CLAUDE_CODE_OAUTH_TOKEN set: subscription auth (claude-code);
          # otherwise API-key billing (api)
          JUDGE_BACKEND: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'claude-code' || 'api' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/collect.py

      - name: Archive stale items
        run: python pipeline/expire.py

      - name: Commit new insights
        id: commit
        run: |
          git config user.name "curasec-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/insights pipeline/processed.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no new items — skipping commit"
          else
            git commit -m "chore: daily curation $(date -u +%F)"
            # collect.py can run for minutes, so main may have moved (manual web
            # edits, an overlapping run) by the time we're ready to push — retry
            # with rebase instead of failing outright on a non-fast-forward push.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                break
              fi
              if [ "$attempt" = "5" ]; then
                echo "::error::push failed after 5 attempts — main kept moving faster than we could catch up"
                exit 1
              fi
              echo "push rejected (attempt $attempt/5) — main has new commits, rebasing and retrying"
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::rebase conflict against origin/main — needs manual resolution"
                git rebase --abort
                exit 1
              fi
            done
          fi

      - name: Open failure issue
        if: steps.judge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Daily pipeline failure — $(date -u +%F)" \
            --body "The collect/judge step failed (likely credits or auth token — check the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})). Judgments completed before the failure were committed. Unprocessed items retry on the next run. If the OAuth token expired: \`claude setup-token\` → update the \`CLAUDE_CODE_OAUTH_TOKEN\` secret, then close this issue."

      - name: Surface judge failure
        if: steps.judge.outcome == 'failure'
        run: |
          echo "::error::Judge step failed (check credits/auth) — successful judgments were committed"
          exit 1

  deploy:
    needs: collect
    # schedule: deploy only when there are new items / manual & push: always deploy
    if: ${{ !cancelled() && (needs.collect.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # include the commit the collect job just pushed

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"
          extended: true

      - name: Build site
        run: hugo --minify

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages deployment queue occasionally stalls past the
          # default 10-minute timeout (transient backend backlog, not our
          # code) — give it more room before giving up.
          timeout: 1200000

      - name: Open deploy failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Deploy failure — $(date -u +%F)" \
            --body "The deploy job failed — check the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Content was already committed to main (the site is stale, not the data). Usually a transient GitHub Pages backend delay — check https://www.githubstatus.com/, then trigger a **fresh** run: \`gh workflow run daily.yml\`. Do NOT use \`gh run rerun --job\` on the same run — re-running just the deploy job re-uploads the Pages artifact and causes an 'Multiple artifacts named github-pages' error."
